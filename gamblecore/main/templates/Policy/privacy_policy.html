<!DOCTYPE html>
<html lang="en">
<head>
    <!--Favicon-->
    <link rel="icon" href="/static/Images/favicon-32x32.png" type="image/png">
    <title>Privacy Policy | Gamblecore</title>
    {% load static %}

    <link rel="stylesheet" href="{% static 'styles.css' %}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen&display=swap" rel="stylesheet">
    <style>
        body {
            text-align: center;
            background-color: #f5f5f5;
            padding: 20px;
        }

        .press-start {
            font-family: 'Press Start 2P', sans-serif;
            color: #333;
        }

        .silkscreen {
            font-family: 'Silkscreen', sans-serif;
            color: #666;
        }
        /* Navbar */
        .navbar * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        }

        .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 20px;
        background-color: #f4f4f4;
        border: 2px solid #ddd;
        border-radius: 10px;
        }

        .navbar-title {
        font-size: 24px;
        font-weight: bold;
        font-family: 'Silkscreen', sans-serif;
        color: #333;
        }

        .navbar-links {
        display: flex;
        gap: 15px;
        }

        .navbar-links a {
        text-decoration: none;
        color: #007bff;
        font-size: 18px;
        padding: 5px 10px;
        border-radius: 5px;
        }

        .navbar-links a:hover {
        background-color: #e6e6e6;
        }
    </style>
</head>
<body>
    <!--Website Navigation starts here-->
    <div class="navbar">
        <div class="navbar-title">🎲 <font color="#cc0000">G</font><font color="#38761d">a</font><font color="#cc0000">m</font><font color="#93c47d">b</font><font color="#cc0000">l</font><font color="#93c47d">e</font><font color="#cc0000">c</font><font color="#38761d">o</font><font color="#cc0000">r</font><font color="#38761d">e</font> </div>

        </div>
      </div>
    <!--Website Navigation ends here-->

    <h1 class="press-start style="font-size:50px;"><font color="#d9d900"><u>Privacy Policy</u></font></h1>

</body>
</html>
