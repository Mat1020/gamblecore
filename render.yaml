services:
  - type: web
    name: gamblecore
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: python ./manage.py migrate && python ./manage.py runserver 0.0.0.0:8000
    rootDir: .
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: "gamblecore.settings"